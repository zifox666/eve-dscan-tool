services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.golang
    environment:
      APP_ENV: development
      HTTP_ADDR: :8000
      DATABASE_URL: postgres://dscan:dscan@postgres:5432/dscan?sslmode=disable
      SDE_URL: postgres://dscan:dscan@postgres:5432/dscan?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dscan
      POSTGRES_USER: dscan
      POSTGRES_PASSWORD: dscan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dscan -d dscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
